aid: halo-precision-diagnostics
name: HALO Precision Diagnostics
description: 'HALO Precision Diagnostics (HALO Dx) is a Menlo Park, California precision-diagnostics
  company that acquires community imaging centers and rebuilds them as what it calls Imaging
  Center 2.0 — next-generation diagnostic hubs where advanced imaging, genomics and biomarker
  testing are all performed under one roof. Its diagnostic ensemble combines whole-body and
  multiparametric MRI, PSMA-targeted PET (PYLARIFY), digital pathology, polygenic risk scoring,
  hereditary and proteomic testing, and AI-assisted interpretation, applied first to cancer —
  the prostate program adds MRI-guided targeted biopsy and MRI-guided TULSA-PRO focal ablation —
  and expanding into cardiovascular disease and dementia. The company is led by CEO Michael Uhl
  with co-founder Brian Axe as Chief Product Officer and Dr. John Feller as Chief Medical Officer.
  Clinical delivery happens in HALO''s own centers; referring physicians reach orders, results
  and images through a vendor-operated provider portal (RoyalMD) and the eUnity enterprise image
  viewer, and HALO advertises EMR integration for pushing orders and pulling results as a service
  its vendors deliver rather than as an interface it publishes. HALO operates no public developer
  program, publishes no API documentation, ships no SDK, and serves no machine-readable API
  contract; the only JSON on halodx.com is the marketing site''s stock WordPress core REST API.'
